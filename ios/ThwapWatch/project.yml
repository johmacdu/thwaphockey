# XcodeGen spec for the standalone Thwap Apple Watch app.
# Regenerate the project after editing:  cd ios/ThwapWatch && xcodegen generate
#
# This is a SIBLING project to the Capacitor app (ios/App). ios/App/App.xcodeproj
# references it as a subproject and embeds the ThwapWatch target's product in
# App.app/Watch. Keep the ThwapWatch target name stable: the App project points
# at it by XcodeGen's deterministic target id.
name: ThwapWatch
options:
  bundleIdPrefix: com.thwaphockey.app
  deploymentTarget:
    watchOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Must equal the iPhone app's MARKETING_VERSION and CURRENT_PROJECT_VERSION
    # (ios/App/App.xcodeproj). App Store Connect rejects an upload whose
    # embedded watch app has a different version or build number.
    # ios/scripts/embed-watch.rb checks this.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
packages:
  ThwapCore:
    path: ThwapCore
targets:
  ThwapWatch:
    type: application
    platform: watchOS
    sources:
      - WatchApp
      - Shared
    dependencies:
      - package: ThwapCore
      - target: ThwapComplication
    entitlements:
      path: WatchApp/ThwapWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.thwaphockey.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thwaphockey.app.watchkitapp
        PRODUCT_NAME: Thwap
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Thwap
        INFOPLIST_KEY_WKApplication: YES
        # "Supports running without iOS app installation" = YES (standalone).
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.thwaphockey.app
        TARGETED_DEVICE_FAMILY: "4"
        ENABLE_PREVIEWS: YES
        # The watch app ships inside the iPhone app (App.app/Watch), so an
        # archive of the App scheme must not also install it at the top level.
        SKIP_INSTALL: YES
  ThwapComplication:
    type: app-extension
    platform: watchOS
    sources:
      - Complication
      - Shared
    dependencies:
      - package: ThwapCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Complication/ThwapComplication.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.thwaphockey.app
    info:
      path: Complication/Info.plist
      properties:
        CFBundleDisplayName: Thwap rings
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thwaphockey.app.watchkitapp.rings
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
  ThwapWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: ThwapCore/Tests/ThwapCoreTests
        # Fixtures are read from the source tree via #filePath, not bundled.
        excludes:
          - "Fixtures/**"
    dependencies:
      - package: ThwapCore
      - target: ThwapWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thwaphockey.app.watchkitapp.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Thwap.app/Thwap"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  ThwapWatch:
    build:
      targets:
        ThwapWatch: all
        ThwapComplication: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ThwapWatchTests
