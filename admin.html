<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thwap Admin - Drill suggestions</title>
<style>
:root{
  --bg:#F3F7F4;--panel:#FFFFFF;--line:#DCE5DE;--line2:#C9D5CC;--text:#15221B;
  --muted:#5F6F64;--green:#2F6B41;--lime:#B9F06B;--ink:#15221B;--soft:#E7EEE8;
  --alert-text:#C0362C;--card2:#F7FAF7;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;padding:24px 16px}
.wrap{max-width:760px;margin:0 auto}
h1{font-family:'Archivo Black',system-ui,sans-serif;font-size:26px;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 20px}
.keybar{display:flex;gap:8px;margin-bottom:18px}
.keybar input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font:inherit;background:var(--panel);color:var(--text)}
.keybar button{padding:10px 18px;border:0;border-radius:12px;background:var(--lime);color:var(--ink);font-weight:850;font-size:14px;cursor:pointer}
.seg{display:inline-flex;gap:4px;background:var(--soft);border-radius:999px;padding:4px;margin-bottom:16px}
.seg button{font-size:13px;font-weight:800;padding:6px 14px;border:0;border-radius:999px;color:var(--muted);background:none;cursor:pointer}
.seg button.on{background:var(--lime);color:var(--ink)}
.msg{color:var(--muted);font-size:14px;padding:20px 0;text-align:center}
.msg.err{color:var(--alert-text)}
.row{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:14px;margin-bottom:10px}
.row.dismissed{opacity:.55}
.row-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cat{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--green)}
.status{margin-left:auto;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;color:var(--muted)}
.status.accepted{color:var(--green)}
.status.dismissed{color:var(--alert-text)}
.txt{font-size:15px;font-weight:600;line-height:1.4}
.meta{font-size:12px;color:var(--muted);margin-top:6px}
.acts{display:flex;gap:8px;margin-top:10px}
.acts button{font:inherit;font-size:13px;font-weight:800;border-radius:10px;padding:8px 14px;cursor:pointer;border:1px solid var(--line2);background:transparent;color:var(--text)}
.acts .accept{background:var(--lime);color:var(--ink);border-color:transparent}
.acts .dismiss{color:var(--alert-text)}
/* roster editor */
.pcard{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:14px;margin-bottom:12px}
.pcard-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.pavatar{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--soft);flex:none;border:1px solid var(--line)}
.pavatar.empty{display:grid;place-items:center;color:var(--muted);font-weight:800;font-size:18px}
.pname{font-weight:800;font-size:16px}
.pteam{font-size:12px;color:var(--muted)}
.pfields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pfields label{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;color:var(--muted)}
.pfields input,.pfields select{padding:8px 10px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14px;background:var(--panel);color:var(--text);text-transform:none;font-weight:500}
.pfields .full{grid-column:1 / -1}
.pbtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pbtns button{font:inherit;font-size:13px;font-weight:800;border-radius:10px;padding:8px 14px;cursor:pointer;border:1px solid var(--line2);background:transparent;color:var(--text)}
.pbtns .save{background:var(--lime);color:var(--ink);border-color:transparent}
.pbtns .addphoto{background:var(--soft);border-color:transparent}
.psaved{font-size:12px;font-weight:800;color:var(--green);align-self:center}
.consent{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;display:none}
.consent.open{display:block}
.consent .note{font-size:12px;color:var(--muted);margin:0 0 8px}
.consent-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.consent-row .full{grid-column:1 / -1}
.consent-row label{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted)}
.consent-row input,.consent-row select{padding:8px 10px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14px;background:var(--panel);color:var(--text);font-weight:500}
.consent .filepick{margin-top:8px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Drill suggestions</h1>
  <p class="sub">Thwap review. Coaches recommend drills; accept the good ones into the library or dismiss.</p>
  <div class="keybar" id="loginbar">
    <input id="email" type="email" placeholder="Admin email" autocomplete="username" value="hi@woodymacduffie.com">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <button id="load">Sign in</button>
  </div>
  <div class="keybar" id="setpwbar" hidden>
    <input id="pw1" type="password" placeholder="Set a password (8+ chars)" autocomplete="new-password">
    <input id="pw2" type="password" placeholder="Confirm password" autocomplete="new-password">
    <button id="setpw">Set password</button>
  </div>
  <div class="seg" id="viewnav" hidden>
    <button data-v="drills" class="on">Drills</button>
    <button data-v="roster">Roster</button>
  </div>
  <div id="viewDrills">
  <div class="seg" id="filter" hidden>
    <button data-f="new" class="on">New</button>
    <button data-f="accepted">Accepted</button>
    <button data-f="dismissed">Dismissed</button>
    <button data-f="all">All</button>
  </div>
  <div id="msg" class="msg">Sign in with your admin email and password.</div>
  <div id="list"></div>
  </div>
  <div id="viewRoster" hidden>
    <p class="sub">Edit player details, and add a photo with recorded parent consent.</p>
    <div id="rmsg" class="msg">Load with your admin key to see the roster.</div>
    <div id="rlist"></div>
  </div>
</div>
<script>
(function(){
  var key='', token='', all=[], filter='new';
  var msg=document.getElementById('msg'),
      list=document.getElementById('list'), seg=document.getElementById('filter');
  var emailEl=document.getElementById('email'), pwEl=document.getElementById('pw'),
      loginbar=document.getElementById('loginbar'), setpwbar=document.getElementById('setpwbar');
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function tokenQS(){ return 'adminToken='+encodeURIComponent(token); }
  var CAT={stick:'Hands',shoot:'Shoot',dryland:'Dryland'};
  function render(){
    var rows=all.filter(function(s){ return filter==='all'?true:(s.status||'new')===filter; });
    if(!rows.length){ list.innerHTML=''; msg.textContent='Nothing here.'; msg.className='msg'; return; }
    msg.textContent=''; msg.className='msg';
    list.innerHTML=rows.map(function(s){
      var st=s.status||'new';
      return "<div class='row "+st+"'>"+
        "<div class='row-top'><span class='cat'>"+esc(CAT[s.category]||s.category)+"</span>"+
        "<span class='status "+st+"'>"+st+"</span></div>"+
        "<div class='txt'>"+esc(s.text)+"</div>"+
        "<div class='meta'>"+esc(s.teamName||s.teamCode)+" &middot; "+esc(s.byCoach||'')+" &middot; "+esc((s.at||'').slice(0,10))+"</div>"+
        "<div class='acts'>"+
          "<button class='accept' data-id='"+esc(s.id)+"' data-code='"+esc(s.teamCode)+"' data-st='accepted'>Accept</button>"+
          "<button class='dismiss' data-id='"+esc(s.id)+"' data-code='"+esc(s.teamCode)+"' data-st='dismissed'>Dismiss</button>"+
        "</div></div>";
    }).join('');
    list.querySelectorAll('.acts button').forEach(function(b){
      b.addEventListener('click',function(){ resolve(b.getAttribute('data-code'), b.getAttribute('data-id'), b.getAttribute('data-st')); });
    });
  }
  function afterAuth(){
    document.getElementById('viewnav').hidden=false;
    fetch('/api/coach?action=review-suggestions&'+tokenQS())
      .then(function(r){ if(r.status===401){ throw new Error('Session expired, sign in again.'); } return r.json(); })
      .then(function(j){ all=(j&&j.suggestions)||[]; seg.hidden=false; render(); })
      .catch(function(e){ msg.textContent=e.message||'Could not load.'; msg.className='msg err'; });
    loadRoster();
  }
  function signIn(){
    var email=emailEl.value.trim(), pw=pwEl.value;
    if(!email){ msg.textContent='Enter your admin email.'; msg.className='msg err'; return; }
    msg.textContent='Signing in...'; msg.className='msg';
    // Check first-run: if no password set yet, show the set-password bar.
    fetch('/api/coach?action=admin-status&email='+encodeURIComponent(email))
      .then(function(r){ return r.json(); })
      .then(function(st){
        if(st && st.exists && !st.hasPassword){
          loginbar.hidden=true; setpwbar.hidden=false;
          msg.textContent='First sign in: set a password for '+email; msg.className='msg';
          return;
        }
        return fetch('/api/coach?action=admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pw})})
          .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
          .then(function(res){
            if(!res.ok){ msg.textContent=(res.j&&res.j.error)||'Sign in failed.'; msg.className='msg err'; return; }
            token=res.j.token; msg.textContent=''; afterAuth();
          });
      })
      .catch(function(){ msg.textContent='Could not sign in.'; msg.className='msg err'; });
  }
  function setPw(){
    var email=emailEl.value.trim(), p1=document.getElementById('pw1').value, p2=document.getElementById('pw2').value;
    if(p1.length<8){ msg.textContent='Password must be at least 8 characters.'; msg.className='msg err'; return; }
    if(p1!==p2){ msg.textContent='Passwords do not match.'; msg.className='msg err'; return; }
    fetch('/api/coach?action=admin-set-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:p1})})
      .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
      .then(function(res){
        if(!res.ok){ msg.textContent=(res.j&&res.j.error)||'Could not set password.'; msg.className='msg err'; return; }
        token=res.j.token; setpwbar.hidden=true; loginbar.hidden=false; msg.textContent=''; afterAuth();
      })
      .catch(function(){ msg.textContent='Could not set password.'; msg.className='msg err'; });
  }
  function resolve(code,id,status){
    fetch('/api/coach?action=resolve-suggestion&'+tokenQS(),
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code,id:id,status:status})})
      .then(function(r){ return r.json(); })
      .then(function(j){ if(j&&j.ok){ all.forEach(function(s){ if(s.id===id&&s.teamCode===code) s.status=status; }); render(); } })
      .catch(function(){});
  }
  document.getElementById('load').addEventListener('click',signIn);
  document.getElementById('setpw').addEventListener('click',setPw);
  pwEl.addEventListener('keydown',function(e){ if(e.key==='Enter') signIn(); });
  emailEl.addEventListener('keydown',function(e){ if(e.key==='Enter') signIn(); });
  document.getElementById('pw2').addEventListener('keydown',function(e){ if(e.key==='Enter') setPw(); });
  seg.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click',function(){ filter=b.getAttribute('data-f'); seg.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x===b); }); render(); });
  });

  // ---- roster editor ----
  var players=[];
  var rmsg=document.getElementById('rmsg'), rlist=document.getElementById('rlist');
  var POS=['','Forward','Defense','Goalie'];
  var CONSENT=[['','How was consent given?'],['text','Text message'],['in_person','In person'],['written','Written / signed'],['email','Email']];
  function loadRoster(){
    rmsg.textContent='Loading roster...'; rmsg.className='msg';
    fetch('/api/coach?action=admin-roster&'+tokenQS())
      .then(function(r){ if(r.status===401){ throw new Error('Bad admin key.'); } return r.json(); })
      .then(function(j){ players=(j&&j.players)||[]; renderRoster(); })
      .catch(function(e){ rmsg.textContent=e.message||'Could not load roster.'; rmsg.className='msg err'; });
  }
  function initial(p){ return esc(((p.firstName||p.name||'?')[0]||'?').toUpperCase()); }
  function renderRoster(){
    if(!players.length){ rlist.innerHTML=''; rmsg.textContent='No players.'; rmsg.className='msg'; return; }
    rmsg.textContent=''; rmsg.className='msg';
    rlist.innerHTML=players.map(function(p,i){
      var av=p.photo
        ? "<img class='pavatar' src='"+esc(p.photo)+"' alt=''>"
        : "<div class='pavatar empty'>"+initial(p)+"</div>";
      var posOpts=POS.map(function(v){ return "<option value='"+v+"'"+((p.position||'')===v?" selected":"")+">"+(v||'Position')+"</option>"; }).join('');
      var conOpts=CONSENT.map(function(c){ return "<option value='"+c[0]+"'>"+esc(c[1])+"</option>"; }).join('');
      return "<div class='pcard' data-i='"+i+"' data-id='"+esc(p.id)+"'>"+
        "<div class='pcard-top'>"+av+"<div><div class='pname'>"+esc(p.name||p.firstName||p.id)+"</div>"+
          "<div class='pteam'>"+esc(p.teamName||p.teamCode||'')+"</div></div></div>"+
        "<div class='pfields'>"+
          "<label>First<input class='f-first' value='"+esc(p.firstName||'')+"'></label>"+
          "<label>Last<input class='f-last' value='"+esc(p.lastName||'')+"'></label>"+
          "<label>Number<input class='f-num' value='"+esc(p.number||'')+"'></label>"+
          "<label>Position<select class='f-pos'>"+posOpts+"</select></label>"+
          "<label class='full'>Parent email (dad)<input class='f-pe' value='"+esc(p.parentEmail||'')+"'></label>"+
          "<label class='full'>Parent email (mom)<input class='f-pe2' value='"+esc(p.parentEmail2||'')+"'></label>"+
        "</div>"+
        "<div class='pbtns'>"+
          "<button class='save'>Save details</button>"+
          "<button class='addphoto'>Add photo</button>"+
          "<span class='psaved' hidden>Saved</span>"+
        "</div>"+
        "<div class='consent'>"+
          "<p class='note'>A photo of a child needs a parent's OK. Record how that parent gave permission. This is stored with the photo as an honest consent record.</p>"+
          "<div class='consent-row'>"+
            "<label>Consent method<select class='c-method'>"+conOpts+"</select></label>"+
            "<label>Parent name<input class='c-by' placeholder='e.g. Josh Delatoree'></label>"+
          "</div>"+
          "<input type='file' accept='image/*' class='c-file filepick'>"+
          "<div class='pbtns'><button class='c-upload save'>Upload photo</button></div>"+
        "</div>"+
      "</div>";
    }).join('');
    rlist.querySelectorAll('.pcard').forEach(function(card){
      card.querySelector('.save').addEventListener('click',function(){ savePlayer(card); });
      card.querySelector('.addphoto').addEventListener('click',function(){ card.querySelector('.consent').classList.toggle('open'); });
      card.querySelector('.c-upload').addEventListener('click',function(){ uploadPhoto(card); });
    });
  }
  function flash(card){ var s=card.querySelector('.psaved'); s.hidden=false; setTimeout(function(){ s.hidden=true; },1800); }
  function savePlayer(card){
    var id=card.getAttribute('data-id');
    var body={ playerId:id,
      firstName:card.querySelector('.f-first').value.trim(),
      lastName:card.querySelector('.f-last').value.trim(),
      number:card.querySelector('.f-num').value.trim(),
      position:card.querySelector('.f-pos').value,
      parentEmail:card.querySelector('.f-pe').value.trim(),
      parentEmail2:card.querySelector('.f-pe2').value.trim() };
    fetch('/api/coach?action=admin-update-player&'+tokenQS(),
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
      .then(function(res){ if(!res.ok){ alert((res.j&&res.j.error)||'Save failed'); return; } flash(card); })
      .catch(function(){ alert('Save failed'); });
  }
  // Downscale to <=512px longest edge, JPEG, return a data URL under the 400KB cap.
  function fileToDataUrl(file, cb){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      var max=512, w=img.width, h=img.height, sc=Math.min(1, max/Math.max(w,h));
      var cv=document.createElement('canvas'); cv.width=Math.round(w*sc); cv.height=Math.round(h*sc);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);
      cb(cv.toDataURL('image/jpeg',0.85));
    };
    img.onerror=function(){ URL.revokeObjectURL(url); cb(null); };
    img.src=url;
  }
  function uploadPhoto(card){
    var id=card.getAttribute('data-id');
    var method=card.querySelector('.c-method').value;
    var by=card.querySelector('.c-by').value.trim();
    var file=card.querySelector('.c-file').files[0];
    if(!method){ alert('Choose how the parent gave consent.'); return; }
    if(!by){ alert('Enter the parent\u2019s name who gave consent.'); return; }
    if(!file){ alert('Choose a photo file.'); return; }
    var btn=card.querySelector('.c-upload'); btn.disabled=true; btn.textContent='Uploading...';
    fileToDataUrl(file,function(dataUrl){
      if(!dataUrl){ alert('Could not read that image.'); btn.disabled=false; btn.textContent='Upload photo'; return; }
      fetch('/api/photo/admin-put?'+tokenQS(),
        {method:'POST',headers:{'Content-Type':'application/json'},
         body:JSON.stringify({playerId:id,imageData:dataUrl,consent:{method:method,grantedBy:by}})})
        .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
        .then(function(res){
          btn.disabled=false; btn.textContent='Upload photo';
          if(!res.ok){ alert((res.j&&res.j.error)||'Upload failed'); return; }
          var p=players[parseInt(card.getAttribute('data-i'),10)]; if(p){ p.photo=res.j.url; }
          card.querySelector('.consent').classList.remove('open'); renderRoster();
        })
        .catch(function(){ btn.disabled=false; btn.textContent='Upload photo'; alert('Upload failed'); });
    });
  }
  // view nav
  document.getElementById('viewnav').querySelectorAll('button').forEach(function(b){
    b.addEventListener('click',function(){
      var v=b.getAttribute('data-v');
      document.getElementById('viewnav').querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x===b); });
      document.getElementById('viewDrills').hidden = v!=='drills';
      document.getElementById('viewRoster').hidden = v!=='roster';
    });
  });
})();
</script>
</body>
</html>
