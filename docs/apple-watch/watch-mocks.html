<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thwap Hockey on Apple Watch, mocks</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Nunito+Sans:opsz,wght@6..12,600;6..12,800;6..12,900&display=swap" rel="stylesheet">
<style>
/* Tokens copied from thwaphockey index.html (dark theme + brand) */
:root{
  --ink:#15221B; --lime:#B9F06B; --blue:#75B8FF; --orange:#FF9D4D;
  --stick:#8fd65e; --shoot:#75B8FF; --dryland:#FF9D4D;
  --green2:#CDEFA0; --text:#F3F7F4; --muted:#9DACA2; --line:#2A3831;
  --r-pill:999px;
  --glass:rgba(255,255,255,.10); --glass-edge:rgba(255,255,255,.22);
}
*{box-sizing:border-box}
body{margin:0;background:#0B130E;color:var(--text);font-family:'Nunito Sans',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding:22px 24px}
h1{font-family:'Archivo Black',system-ui,sans-serif;font-weight:400;font-size:22px;margin:0 0 18px;letter-spacing:.01em}
h1 span{font-family:'Nunito Sans',sans-serif;font-weight:600;font-size:15px;color:var(--muted);margin-left:12px}
.row{display:flex;gap:24px;align-items:flex-start}
figure{margin:0;width:444px}
figcaption{margin-top:14px;font-size:14px;line-height:1.4;color:var(--muted)}
figcaption b{color:var(--text);font-weight:800}
.haptic{display:block;margin-top:4px;color:var(--green2);font-weight:800}

/* Device: 46mm display 416x496, 14px bezel */
.bezel{padding:14px;border-radius:118px;background:linear-gradient(160deg,#3a3f3d,#151817 45%,#2b2f2d);box-shadow:0 18px 40px rgba(0,0,0,.5)}
.screen{position:relative;width:416px;height:496px;border-radius:104px;background:#000;overflow:hidden}
.status{position:absolute;top:26px;left:56px;right:56px;display:flex;justify-content:space-between;align-items:center;height:30px}
.navtitle{font-family:'Archivo Black',system-ui,sans-serif;font-size:26px;color:var(--text)}
.clock{font-weight:800;font-size:24px;color:var(--text)}
.content{position:absolute;top:72px;left:22px;right:22px;bottom:18px}

/* Liquid Glass: translucent fill, bright top edge, soft inner glow */
.glass{background:var(--glass);border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -10px 24px rgba(255,255,255,.04);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6)}

/* 1. Checklist: tappable discipline rows */
.drill{display:flex;align-items:center;gap:14px;min-height:94px;padding-top:12px;padding-bottom:12px;padding:0 20px;border-radius:34px;margin-bottom:10px}
.drill .dot{flex:0 0 40px;height:40px;border-radius:50%;border:3px solid var(--dc);display:grid;place-items:center}
.drill .txt{min-width:0}
.drill .eb{font-size:15px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--dc)}
.drill .nm{font-family:'Archivo Black',system-ui,sans-serif;font-size:23px;line-height:1.08}
.drill.todo{background:color-mix(in srgb,var(--dc) 22%,rgba(255,255,255,.04));border-color:color-mix(in srgb,var(--dc) 55%,transparent)}
.drill.done{background:var(--lime);border-color:rgba(255,255,255,.6);color:var(--ink)}
.drill.done .eb{color:var(--ink);opacity:.7}
.drill.done .dot{background:var(--ink);border-color:var(--ink)}
.c-stick{--dc:var(--stick)} .c-shoot{--dc:var(--shoot)} .c-dry{--dc:var(--dryland)}
.foot{text-align:center;font-weight:800;font-size:18px;color:var(--muted);margin-top:4px}

/* 2. Drill running */
.run{display:flex;flex-direction:column;align-items:center}
.run .eb{font-size:16px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--dryland)}
.run .nm{font-family:'Archivo Black',system-ui,sans-serif;font-size:28px;line-height:1.05;margin-top:2px}
.ringwrap{position:relative;width:206px;height:206px;margin-top:8px}
.ringwrap svg{display:block}
.ringlabel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringlabel .t{font-family:'Archivo Black',system-ui,sans-serif;font-size:58px;line-height:1;font-variant-numeric:tabular-nums}
.ringlabel .s{font-size:18px;font-weight:800;color:var(--muted);margin-top:6px}
.bigbtn{position:absolute;left:22px;right:22px;bottom:26px;height:86px;border-radius:var(--r-pill);display:grid;place-items:center;font-family:'Archivo Black',system-ui,sans-serif;font-size:32px;color:var(--ink);background:var(--lime);border:1px solid rgba(255,255,255,.7);box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -8px 16px rgba(0,0,0,.12)}

/* 3. THWAP stamp (from .pl-thwap: Archivo Black, lime, 3px ink stroke, -8deg) */
.stampscreen{background:radial-gradient(circle at 50% 44%,rgba(185,240,107,.28),rgba(0,0,0,0) 62%),#000}
.stampwrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:20px}
.thwap{font-family:'Archivo Black',system-ui,sans-serif;font-size:84px;line-height:1;color:var(--lime);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;transform:rotate(-8deg);text-shadow:0 4px 0 var(--ink),0 0 30px rgba(185,240,107,.45);animation:stamp .7s cubic-bezier(.2,1.6,.4,1) both}
.burst{position:absolute;width:300px;height:300px;left:58px;top:28px}
.stampscreen .dn{margin-top:34px;font-family:'Archivo Black',system-ui,sans-serif;font-size:27px}
.stampscreen .msg{margin-top:6px;font-size:20px;font-weight:800;color:var(--green2)}
.stampscreen .chk{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--lime);margin-right:10px;vertical-align:-4px}
@keyframes stamp{0%{transform:rotate(-8deg) scale(0);opacity:0}60%{transform:rotate(-8deg) scale(1.15);opacity:1}100%{transform:rotate(-8deg) scale(1)}}
@media (prefers-reduced-motion: reduce){.thwap{animation:none}}

/* 4. Game Day Goals: read-only plain rows with hairlines */
.gdhead{font-size:15px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--orange);margin:2px 8px 4px}
.goal{display:flex;align-items:center;gap:14px;padding:16px 8px;border-bottom:1px solid var(--line)}
.goal.last{border-bottom:0}
.goal .n{flex:0 0 26px;font-family:'Archivo Black',system-ui,sans-serif;font-size:22px;color:var(--orange)}
.goal .g{font-family:'Archivo Black',system-ui,sans-serif;font-size:24px;line-height:1.1}
.gdnote{margin:8px 8px 0;font-size:17px;font-weight:800;color:var(--muted)}

/* 5. Watch face with complications */
.face{background:radial-gradient(circle at 70% 20%,#14261b,#000 70%)}
.face .date{position:absolute;top:50px;right:60px;font-weight:900;font-size:22px;color:var(--orange);letter-spacing:.04em}
.face .time{position:absolute;top:80px;right:50px;font-family:'Archivo Black',system-ui,sans-serif;font-size:92px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.comp-circ{position:absolute;top:70px;left:40px;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.06)}
.comp-rect{position:absolute;left:30px;right:30px;bottom:34px;height:178px;border-radius:30px;padding:16px 22px}
.comp-rect .eb{font-size:15px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--lime)}
.comp-rect .hl{font-family:'Archivo Black',system-ui,sans-serif;font-size:24px;margin:2px 0 12px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800;color:var(--muted)}
.bar .lbl{width:78px}
.bar .tr{flex:1;height:9px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.bar .fl{height:100%;border-radius:9px;background:var(--dc)}
.complabel{position:absolute;top:150px;left:30px;width:128px;text-align:center;font-size:13px;font-weight:800;color:var(--muted)}
</style>
</head>
<body>
<h1>Thwap Hockey on Apple Watch <span>watchOS 26, 46mm (416 x 496), dark, Liquid Glass</span></h1>
<div class="row">

  <!-- 1. Today's drills -->
  <figure>
    <div class="bezel"><div class="screen">
      <div class="status"><div class="navtitle">Today</div><div class="clock">4:12</div></div>
      <div class="content">
        <div class="drill done glass c-stick">
          <div class="dot"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M4 11.5l4.5 4.5L18 6.5" fill="none" stroke="#B9F06B" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="txt"><div class="eb">Stickhandling</div><div class="nm">Figure-8 Around Cones</div></div>
        </div>
        <div class="drill todo glass c-shoot">
          <div class="dot"></div>
          <div class="txt"><div class="eb">Shooting</div><div class="nm">Quick Hands</div></div>
        </div>
        <div class="drill todo glass c-dry">
          <div class="dot"></div>
          <div class="txt"><div class="eb">Dryland</div><div class="nm">Wall Sit</div></div>
        </div>
        <div class="foot">1 of 3 done. Keep going!</div>
      </div>
    </div></div>
    <figcaption><b>1. Today's drills.</b> One tappable row per discipline; a done row turns lime with a check.</figcaption>
  </figure>

  <!-- 2. Drill running -->
  <figure>
    <div class="bezel"><div class="screen">
      <div class="status"><div></div><div class="clock">4:15</div></div>
      <div class="content run" style="top:42px">
        <div class="eb">Dryland</div>
        <div class="nm">Wall Sit</div>
        <div class="ringwrap">
          <svg width="206" height="206" viewBox="0 0 206 206">
            <circle cx="103" cy="103" r="90" fill="none" stroke="rgba(255,157,77,.22)" stroke-width="18"/>
            <circle cx="103" cy="103" r="90" fill="none" stroke="#FF9D4D" stroke-width="18" stroke-linecap="round"
              stroke-dasharray="565.5" stroke-dashoffset="226.2" transform="rotate(-90 103 103)"/>
          </svg>
          <div class="ringlabel"><div class="t">0:18</div><div class="s">Set 2 of 4</div></div>
        </div>
      </div>
      <div class="bigbtn">Done</div>
    </div></div>
    <figcaption><b>2. Drill running.</b> 4 sets of 30 sec. Ring counts down in the discipline color; one huge Done.</figcaption>
  </figure>

  <!-- 3. THWAP stamp -->
  <figure>
    <div class="bezel"><div class="screen stampscreen">
      <svg class="burst" viewBox="0 0 300 300" aria-hidden="true">
        <g stroke="#B9F06B" stroke-width="6" stroke-linecap="round" opacity=".55">
          <line x1="150" y1="18" x2="150" y2="52"/>
          <line x1="18" y1="150" x2="52" y2="150"/><line x1="248" y1="150" x2="282" y2="150"/>
          <line x1="57" y1="57" x2="80" y2="80"/>
          <line x1="243" y1="57" x2="220" y2="80"/>
        </g>
      </svg>
      <div class="stampwrap">
        <div class="thwap">THWAP!</div>
        <div class="dn"><span class="chk"><svg width="18" height="18" viewBox="0 0 22 22"><path d="M4 11.5l4.5 4.5L18 6.5" fill="none" stroke="#15221B" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Wall Sit</div>
        <div class="msg">You showed up. 2 of 3 today.</div>
      </div>
    </div></div>
    <figcaption><b>3. Check-off moment.</b> THWAP! stamp lands, auto-returns to Today after about 1.5 sec.
      <span class="haptic">Haptic: one .success tap as the stamp hits. Reduced motion: stamp appears without the pop.</span></figcaption>
  </figure>

  <!-- 4. Game Day Goals -->
  <figure>
    <div class="bezel"><div class="screen">
      <div class="status"><div class="navtitle">Game Day</div><div class="clock">8:40</div></div>
      <div class="content" style="left:40px;right:40px">
        <div class="gdhead">My 4 goals</div>
        <div class="goal"><div class="n">1</div><div class="g">Scan Twice</div></div>
        <div class="goal"><div class="n">2</div><div class="g">Head Up on the Puck</div></div>
        <div class="goal"><div class="n">3</div><div class="g">Win the Next Shift</div></div>
        <div class="goal last"><div class="n">4</div><div class="g">Positive Voice</div></div>
        <div class="gdnote">Have fun out there.</div>
      </div>
    </div></div>
    <figcaption><b>4. Game Day Goals.</b> Read-only: the 4 goals the kid picked, plain rows on hairlines, nothing to tap.</figcaption>
  </figure>

  <!-- 5. Watch face + complications -->
  <figure>
    <div class="bezel"><div class="screen face">
      <div class="comp-circ glass">
        <svg width="96" height="96" viewBox="0 0 96 96" aria-label="Stickhandling done, shooting not yet, dryland done">
          <g fill="none" stroke-width="9" stroke-linecap="round" transform="rotate(-90 48 48)">
            <circle cx="48" cy="48" r="39" stroke="rgba(143,214,94,.25)"/>
            <circle cx="48" cy="48" r="39" stroke="#8fd65e" stroke-dasharray="245" stroke-dashoffset="0"/>
            <circle cx="48" cy="48" r="28" stroke="rgba(117,184,255,.25)"/>
            <circle cx="48" cy="48" r="28" stroke="#75B8FF" stroke-dasharray="176" stroke-dashoffset="176"/>
            <circle cx="48" cy="48" r="17" stroke="rgba(255,157,77,.25)"/>
            <circle cx="48" cy="48" r="17" stroke="#FF9D4D" stroke-dasharray="107" stroke-dashoffset="0"/>
          </g>
        </svg>
      </div>
      <div class="date">WED 28</div>
      <div class="time">4:12</div>
      <div class="comp-rect glass">
        <div class="eb">Thwap today</div>
        <div class="hl">Next: Quick Hands</div>
        <div class="bars">
          <div class="bar c-stick"><span class="lbl">Stick</span><span class="tr"><span class="fl" style="width:100%;display:block"></span></span></div>
          <div class="bar c-shoot"><span class="lbl">Shoot</span><span class="tr"><span class="fl" style="width:0%;display:block"></span></span></div>
          <div class="bar c-dry"><span class="lbl">Dryland</span><span class="tr"><span class="fl" style="width:100%;display:block"></span></span></div>
        </div>
      </div>
    </div></div>
    <figcaption><b>5. Watch face.</b> Circular complication: 3 rings, stick outer, shoot middle, dryland inner. Rectangular variant below.</figcaption>
  </figure>

</div>
</body>
</html>
