<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thwap character lab</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#101A14;color:#EAF2EC}
h1{font-size:18px;margin:16px}
.row{display:flex;flex-wrap:wrap;gap:16px;padding:0 16px 16px}
.slot{position:relative;width:260px;height:364px;border-radius:14px;overflow:hidden;background:#0f1712}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cap{font-size:13px;color:#A9B8AD;margin-top:6px}
.slot.light{background:#F3F7F4}
</style></head><body>
<h1>Character lab (prototype, colors only, no art yet)</h1>
<div class="row" id="r"></div>
<script>localStorage.setItem('thwapAvatarPreview','1')</script>
<script src="avatar.js"></script>
<script>
var A=window.thwapAvatar, r=document.getElementById('r');
[['red','s3','brown','72','plate_front_red.svg'],['black','s5','black','9','plate_front_red.svg'],['white','s1','blonde','27',null]].forEach(function(c){
  var d=document.createElement('div');
  d.innerHTML="<div class='slot"+(c[4]?'':' light')+"'>"+(c[4]?"<img src='cards/"+c[4]+"' alt=''>":"")+A.html({jersey:c[0],skin:c[1],hair:c[2],num:c[3]})+"</div><div class='cap'>"+c[0]+" jersey</div>";
  r.appendChild(d);
});
</script></body></html>
