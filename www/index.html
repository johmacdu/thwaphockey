<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Thwap Hockey</title>
  <style>
    html,body{height:100%;margin:0}
    body{
      background:#0b0f14;color:#e8edf2;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      display:flex;align-items:center;justify-content:center;
      text-align:center;padding:24px;box-sizing:border-box;
    }
    .wrap{max-width:320px}
    h1{font-size:22px;margin:0 0 8px}
    p{font-size:15px;line-height:1.5;color:#9aa8b5;margin:0 0 20px}
    button{
      background:#2f9e44;color:#fff;border:0;border-radius:12px;
      padding:12px 22px;font-size:16px;font-weight:600;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>You're offline</h1>
    <p>Thwap Hockey needs a connection to load. Check your internet and try again.</p>
    <button onclick="location.href='https://thwaphockey.com'">Try again</button>
  </div>
</body>
</html>
